<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>像素厨房 · 头部控菜</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        background: #f5efe6;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        font-family: "Press Start 2P", monospace;
        touch-action: none;
      }
      #game-wrapper {
        position: relative;
        width: 100%;
        max-width: 420px;
        aspect-ratio: 9 / 16;
        background: #fdf8f0;
        border-radius: 20px;
        overflow: hidden;
        box-shadow:
          0 8px 0 #d0c8b8,
          0 12px 40px rgba(0, 0, 0, 0.1);
        margin: 12px;
        border: 4px solid #d0c8b8;
      }
      #gameCanvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: block;
        z-index: 2;
        image-rendering: pixelated;
        touch-action: none;
      }
      #webcam {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 1;
        opacity: 0.01;
        pointer-events: none;
      }
      .modal-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(255, 248, 240, 0.88);
        backdrop-filter: blur(4px);
        -webkit-backdrop-filter: blur(4px);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 100;
        padding: 24px;
        animation: fadeIn 0.3s ease;
      }
      .modal-overlay.hidden {
        display: none;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: scale(0.96);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      .modal-card {
        background: #ffffff;
        border-radius: 16px;
        padding: 28px 24px 32px;
        max-width: 360px;
        width: 100%;
        text-align: center;
        color: #3d3a36;
        border: 4px solid #d0c8b8;
        box-shadow:
          0 8px 0 #b0a898,
          0 12px 30px rgba(0, 0, 0, 0.08);
        font-family: "Press Start 2P", monospace;
      }
      .modal-card h2 {
        font-size: 22px;
        font-weight: 700;
        margin-bottom: 12px;
        color: #e67e22;
        text-shadow: 2px 2px 0 #f1c40f;
      }
      .modal-card p {
        font-size: 12px;
        color: #5a5248;
        line-height: 1.8;
        margin: 12px 0 20px;
      }
      .modal-card .btn {
        display: inline-block;
        padding: 14px 32px;
        background: #f39c12;
        border: 4px solid #d68910;
        border-radius: 8px;
        font-size: 14px;
        font-weight: bold;
        color: #2c2a26;
        cursor: pointer;
        transition: all 0.05s linear;
        box-shadow: 0 4px 0 #b9770e;
        font-family: "Press Start 2P", monospace;
        letter-spacing: 0.5px;
      }
      .modal-card .btn:active {
        transform: translateY(4px);
        box-shadow: 0 0px 0 #b9770e;
      }
      .modal-card .btn-secondary {
        background: #ecf0f1;
        border-color: #bdc3c7;
        box-shadow: 0 4px 0 #95a5a6;
        color: #2c3e50;
      }
      .modal-card .btn-secondary:active {
        transform: translateY(4px);
        box-shadow: 0 0px 0 #95a5a6;
      }
      .modal-card .btn-group {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: 10px;
      }
      .settings-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 0;
        border-bottom: 2px dotted #d0c8b8;
        font-size: 11px;
      }
      .settings-row:last-child {
        border-bottom: none;
      }
      .toggle-wrap {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .toggle-btn {
        padding: 4px 14px;
        border-radius: 4px;
        border: 2px solid #b0a898;
        background: #f5efe6;
        color: #3d3a36;
        font-size: 10px;
        cursor: pointer;
        font-family: "Press Start 2P", monospace;
        transition: 0.1s;
      }
      .toggle-btn.active {
        background: #f1c40f;
        border-color: #d4ac0d;
        color: #2c2a26;
      }
      .score-number {
        font-size: 56px;
        font-weight: bold;
        color: #e67e22;
        text-shadow: 4px 4px 0 #f1c40f;
        line-height: 1.2;
      }
      .score-label {
        font-size: 12px;
        color: #7a7268;
        letter-spacing: 2px;
        text-transform: uppercase;
      }
      .stat-row {
        display: flex;
        justify-content: center;
        gap: 24px;
        margin: 16px 0 20px;
      }
      .stat-item .num {
        font-size: 24px;
        font-weight: bold;
        color: #2c3e50;
      }
      .stat-item .label {
        font-size: 10px;
        color: #7a7268;
      }
      @media (max-width: 440px) {
        .modal-card {
          padding: 20px 16px 24px;
        }
        .modal-card h2 {
          font-size: 18px;
        }
        .score-number {
          font-size: 40px;
        }
      }
    </style>
  </head>
  <body>
    <div id="game-wrapper">
      <canvas id="gameCanvas"></canvas>
      <video id="webcam" playsinline muted></video>

      <!-- 弹窗：摄像头权限 -->
      <div id="cameraModal" class="modal-overlay">
        <div class="modal-card">
          <h2>📷 开启摄像头</h2>
          <p>
            向左歪头 → 接左道食材<br />向右歪头 → 接右道食材<br />抬头 →
            出餐上菜
          </p>
          <button class="btn" id="cameraAllowBtn">📸 允许并开始</button>
          <div style="margin-top: 14px; font-size: 9px; color: #7a7268">
            仅用于头部追踪
          </div>
        </div>
      </div>

      <!-- 弹窗：暂停 -->
      <div id="pauseModal" class="modal-overlay hidden">
        <div class="modal-card">
          <h2>⏸ 暂停</h2>
          <div style="margin: 16px 0 4px">
            <div class="settings-row">
              <span>🎵 音乐</span>
              <div class="toggle-wrap">
                <button
                  class="toggle-btn active"
                  data-setting="bgm"
                  data-val="on"
                >
                  开</button
                ><button class="toggle-btn" data-setting="bgm" data-val="off">
                  关
                </button>
              </div>
            </div>
            <div class="settings-row">
              <span>🔊 音效</span>
              <div class="toggle-wrap">
                <button
                  class="toggle-btn active"
                  data-setting="sfx"
                  data-val="on"
                >
                  开</button
                ><button class="toggle-btn" data-setting="sfx" data-val="off">
                  关
                </button>
              </div>
            </div>
          </div>
          <div class="btn-group">
            <button class="btn" id="resumeBtn">▶ 继续</button
            ><button class="btn btn-secondary" id="surrenderBtn">
              🏳️ 认输
            </button>
          </div>
        </div>
      </div>

      <!-- 弹窗：结算 -->
      <div id="resultModal" class="modal-overlay hidden">
        <div class="modal-card">
          <h2>🍳 时间到！</h2>
          <div class="score-number" id="finalScore">0</div>
          <div class="score-label">最终得分</div>
          <div class="stat-row">
            <div class="stat-item">
              <div class="num" id="statDishes">0</div>
              <div class="label">出餐</div>
            </div>
            <div class="stat-item">
              <div class="num" id="statIngredients">0</div>
              <div class="label">食材</div>
            </div>
            <div class="stat-item">
              <div class="num" id="statCombo">0</div>
              <div class="label">连击</div>
            </div>
          </div>
          <button class="btn" id="retryBtn">🔄 再来一局</button>
        </div>
      </div>

      <!-- 弹窗：开始游戏 -->
      <div
        id="startOverlay"
        class="modal-overlay"
        style="background: rgba(255, 248, 240, 0.75)"
      >
        <div class="modal-card" style="background: #fffefc">
          <h2>👨‍🍳 像素厨房</h2>
          <p style="font-size: 11px">头部控制 · 接食材 · 做菜上桌</p>
          <button class="btn" id="startGameBtn">🔥 开始游戏</button>
          <div style="margin-top: 14px; font-size: 9px; color: #7a7268">
            ←歪头移动 · 抬头出餐→
          </div>
        </div>
      </div>
    </div>

    <script>
      // ================================================================
      //  厨师大冒险 - 最终稳定版（传送带向下 + 视频可见 + 触发修复）
      // ================================================================

      if (typeof FaceMesh === "undefined" || typeof Camera === "undefined") {
        alert("⚠️ 关键库加载失败，请检查网络。");
        throw new Error("FaceMesh or Camera not loaded");
      }

      // ---------- DOM 引用 ----------
      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");
      const video = document.getElementById("webcam");

      const cameraModal = document.getElementById("cameraModal");
      const pauseModal = document.getElementById("pauseModal");
      const resultModal = document.getElementById("resultModal");
      const startOverlay = document.getElementById("startOverlay");

      const cameraAllowBtn = document.getElementById("cameraAllowBtn");
      const startGameBtn = document.getElementById("startGameBtn");
      const resumeBtn = document.getElementById("resumeBtn");
      const surrenderBtn = document.getElementById("surrenderBtn");
      const retryBtn = document.getElementById("retryBtn");

      const finalScoreEl = document.getElementById("finalScore");
      const statDishesEl = document.getElementById("statDishes");
      const statIngredientsEl = document.getElementById("statIngredients");
      const statComboEl = document.getElementById("statCombo");

      // ---------- 画布适配 ----------
      function resizeCanvas() {
        const rect = canvas.parentElement.getBoundingClientRect();
        canvas.width = rect.width;
        canvas.height = rect.height;
      }
      resizeCanvas();
      window.addEventListener("resize", resizeCanvas);

      // ---------- 常量 ----------
      const ROWS = 10,
        COLS = 4,
        GAME_DURATION = 90;

      // ---------- 音效系统 ----------
      let audioCtx = null;
      function initAudio() {
        if (!audioCtx)
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      let bgmEnabled = true,
        sfxEnabled = true;

      function playTone(freq, duration, type = "sine", volume = 0.2) {
        if (!sfxEnabled || !audioCtx) return;
        try {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = type;
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(volume, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(
            0.001,
            audioCtx.currentTime + duration,
          );
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + duration);
        } catch (_) {}
      }
      function sfxPickup() {
        playTone(880, 0.08, "sine", 0.15);
      }
      function sfxCook() {
        playTone(660, 0.12, "square", 0.1);
        setTimeout(() => playTone(880, 0.12, "square", 0.1), 120);
      }
      function sfxServe() {
        playTone(1100, 0.1, "sine", 0.18);
        setTimeout(() => playTone(1320, 0.1, "sine", 0.18), 100);
      }
      function sfxMiss() {
        playTone(300, 0.2, "sawtooth", 0.08);
      }
      function sfxCombo() {
        playTone(1000, 0.06, "sine", 0.12);
        setTimeout(() => playTone(1200, 0.06, "sine", 0.12), 80);
        setTimeout(() => playTone(1400, 0.06, "sine", 0.12), 160);
      }

      let bgmInterval = null;
      function startBGM() {
        if (!bgmEnabled) return;
        stopBGM();
        bgmInterval = setInterval(() => {
          if (!bgmEnabled || !audioCtx) return;
          const freqs = [440, 494, 554, 587, 659, 740, 830, 880];
          const f = freqs[Math.floor(Math.random() * freqs.length)];
          playTone(f, 0.15, "sine", 0.04);
        }, 400);
      }
      function stopBGM() {
        if (bgmInterval) {
          clearInterval(bgmInterval);
          bgmInterval = null;
        }
      }

      // ---------- 游戏状态 ----------
      const state = {
        isPlaying: false,
        isPaused: false,
        isGameOver: false,
        timeLeft: GAME_DURATION,
        score: 0,
        dishesServed: 0,
        ingredientsCollected: 0,
        combo: 0,
        maxCombo: 0,
        chefX: 0.5,
        targetX: 0.5,
        headX: 0.5,
        headY: 0.5,
        isHeadUp: false,
        ingredients: [],
        pot: {},
        menu: [],
        menuComplete: false,
        dishName: "",
        leftDemand: null,
        rightDemand: null,
        timerInterval: null,
        queueTimer: 0,
        cameraReady: false,
        faceMesh: null,
        beltOffset: 0,
      };

      // ---------- 食材库 ----------
      const INGREDIENT_TYPES = [
        { id: "tomato", name: "番茄", color: "#e74c3c", emoji: "🍅" },
        { id: "egg", name: "鸡蛋", color: "#f1c40f", emoji: "🥚" },
        { id: "onion", name: "洋葱", color: "#9b59b6", emoji: "🧅" },
        { id: "garlic", name: "大蒜", color: "#ecf0f1", emoji: "🧄" },
        { id: "carrot", name: "胡萝卜", color: "#e67e22", emoji: "🥕" },
        { id: "potato", name: "土豆", color: "#d4a574", emoji: "🥔" },
        { id: "pepper", name: "青椒", color: "#27ae60", emoji: "🫑" },
        { id: "mushroom", name: "蘑菇", color: "#bdc3c7", emoji: "🍄" },
      ];

      const RECIPES = [
        {
          name: "番茄炒蛋",
          emoji: "🍳",
          ingredients: [
            { id: "tomato", count: 2 },
            { id: "egg", count: 3 },
          ],
        },
        {
          name: "蛋炒饭",
          emoji: "🍚",
          ingredients: [
            { id: "egg", count: 2 },
            { id: "onion", count: 1 },
            { id: "carrot", count: 1 },
          ],
        },
        {
          name: "蔬菜沙拉",
          emoji: "🥗",
          ingredients: [
            { id: "tomato", count: 1 },
            { id: "carrot", count: 1 },
            { id: "pepper", count: 1 },
            { id: "onion", count: 1 },
          ],
        },
        {
          name: "蘑菇汤",
          emoji: "🍲",
          ingredients: [
            { id: "mushroom", count: 3 },
            { id: "potato", count: 1 },
            { id: "onion", count: 1 },
          ],
        },
        {
          name: "烤土豆",
          emoji: "🥔",
          ingredients: [
            { id: "potato", count: 3 },
            { id: "garlic", count: 2 },
          ],
        },
        {
          name: "番茄意面",
          emoji: "🍝",
          ingredients: [
            { id: "tomato", count: 3 },
            { id: "onion", count: 1 },
            { id: "garlic", count: 2 },
          ],
        },
      ];

      // ---------- 辅助函数 ----------
      function rand(min, max) {
        return Math.random() * (max - min) + min;
      }
      function randInt(min, max) {
        return Math.floor(rand(min, max + 1));
      }
      function clamp(v, min, max) {
        return Math.max(min, Math.min(max, v));
      }
      function lerp(a, b, t) {
        return a + (b - a) * t;
      }
      function getPos(row, col) {
        const w = canvas.width,
          h = canvas.height;
        const cellH = h / ROWS,
          cellW = w / COLS;
        return {
          x: col * cellW,
          y: row * cellH,
          w: cellW,
          h: cellH,
          cx: col * cellW + cellW / 2,
          cy: row * cellH + cellH / 2,
        };
      }

      // ---------- 菜单生成 ----------
      function generateMenu() {
        const recipe = RECIPES[randInt(0, RECIPES.length - 1)];
        state.dishName = recipe.name;
        state.menu = recipe.ingredients.map((item) => ({
          ...item,
          collected: 0,
        }));
        state.menuComplete = false;
        state.pot = {};
        INGREDIENT_TYPES.forEach((ing) => {
          state.pot[ing.id] = 0;
        });
        state.menu.forEach((item) => {
          state.pot[item.id] = 0;
        });
        state.leftDemand = {
          dish: recipe.name,
          emoji: recipe.emoji,
          side: "left",
        };
        state.rightDemand = null;
        if (Math.random() > 0.5) {
          const other = RECIPES[randInt(0, RECIPES.length - 1)];
          if (other.name !== recipe.name) {
            state.rightDemand = {
              dish: other.name,
              emoji: other.emoji,
              side: "right",
            };
          }
        }
      }

      function checkMenuComplete() {
        if (state.menuComplete) return true;
        let allDone = true;
        state.menu.forEach((item) => {
          if (state.pot[item.id] < item.count) allDone = false;
        });
        if (allDone && state.menu.length > 0) {
          state.menuComplete = true;
          sfxCook();
          return true;
        }
        return false;
      }

      function serveDish() {
        if (!state.isPlaying || state.isPaused || state.isGameOver) return;
        if (!state.menuComplete) {
          sfxMiss();
          return;
        }

        state.dishesServed++;
        state.combo++;
        if (state.combo > state.maxCombo) state.maxCombo = state.combo;

        let points = 10 + Math.min(state.combo, 10) * 2;
        let matched = false;
        if (state.leftDemand && state.leftDemand.dish === state.dishName) {
          points += 15;
          matched = true;
          state.leftDemand = null;
          sfxCombo();
        }
        if (state.rightDemand && state.rightDemand.dish === state.dishName) {
          points += 15;
          matched = true;
          state.rightDemand = null;
          sfxCombo();
        }
        if (!matched) sfxServe();
        else sfxServe();

        state.score += points;
        generateMenu();
        if (!matched) {
          state.combo = Math.floor(state.combo / 2);
        }
        if (matched) sfxCombo();
        else sfxServe();
        updateUI();
      }

      // ---------- 食材生成 ----------
      function queueIngredient() {
        if (!state.isPlaying || state.isPaused || state.isGameOver) return;
        const last = state.ingredients[state.ingredients.length - 1];
        const cellH = canvas.height / ROWS;
        if (last && last.y < cellH * 2.0) return;

        const lane = state.ingredients.length % 2 === 0 ? 0 : 1;
        const typeIdx = randInt(0, INGREDIENT_TYPES.length - 1);
        const type = INGREDIENT_TYPES[typeIdx];
        const cellW = canvas.width / COLS;
        let startX;
        if (lane === 0) startX = cellW * 0.85 + rand(0, cellW * 0.2);
        else startX = cellW * 2.85 + rand(0, cellW * 0.2);

        const ingredient = {
          id: type.id,
          name: type.name,
          color: type.color,
          emoji: type.emoji,
          lane: lane,
          x: startX,
          y: cellH * 0.2,
          startX: startX,
          speed: 0.8 + rand(0, 0.3),
          size: 32 + rand(0, 8),
          alive: true,
        };
        state.ingredients.push(ingredient);
      }

      // ---------- 更新食材 ----------
      function updateIngredients() {
        const cellH = canvas.height / ROWS;
        for (let i = state.ingredients.length - 1; i >= 0; i--) {
          const ing = state.ingredients[i];
          if (!ing.alive) {
            state.ingredients.splice(i, 1);
            continue;
          }

          ing.y += ing.speed * 1.0;
          ing.x = ing.startX + Math.sin(ing.y * 0.02 + Date.now() * 0.0005) * 2;

          if (ing.y > cellH * 7.2) {
            ing.alive = false;
            if (state.combo > 0) {
              state.combo = 0;
              updateUI();
            }
            state.ingredients.splice(i, 1);
            continue;
          }

          const chefPixelX = state.chefX * canvas.width;
          const dist = Math.abs(ing.x - chefPixelX);
          const threshold = 55;

          if (dist < threshold && ing.y > cellH * 4.0 && ing.y < cellH * 6.8) {
            ing.alive = false;
            state.ingredientsCollected++;
            if (state.pot[ing.id] !== undefined)
              state.pot[ing.id] = (state.pot[ing.id] || 0) + 1;
            else state.pot[ing.id] = 1;
            sfxPickup();
            checkMenuComplete();
            updateUI();
            state.ingredients.splice(i, 1);
            continue;
          }

          if (ing.y > cellH * 7.0) {
            ing.alive = false;
            state.ingredients.splice(i, 1);
            if (state.combo > 0) {
              state.combo = 0;
              updateUI();
            }
          }
        }
      }

      // ---------- 游戏更新循环 ----------
      function updateGame(deltaTime) {
        if (!state.isPlaying || state.isPaused || state.isGameOver) return;
        state.timeLeft -= deltaTime;
        if (state.timeLeft <= 0) {
          state.timeLeft = 0;
          endGame();
          return;
        }

        // 传送带向下滚动（累加）
        state.beltOffset += deltaTime * 35;

        state.queueTimer += deltaTime;
        if (state.queueTimer > 0.9 + rand(0, 0.4)) {
          state.queueTimer = 0;
          queueIngredient();
        }

        updateIngredients();

        state.chefX = lerp(state.chefX, state.targetX, 0.18);
        state.chefX = clamp(state.chefX, 0.08, 0.92);

        const headUp = state.headY < 0.35;
        if (headUp && !state.isHeadUp) {
          state.isHeadUp = true;
          serveDish();
        } else if (!headUp) {
          state.isHeadUp = false;
        }

        updateUI();
      }

      // ---------- 图片预加载 ----------
      const images = {
        belt: null,
        pot: null,
        dish: null,
        leftTable: null,
        rightTable: null,
      };

      function loadImages(callback) {
        let loaded = 0;
        const total = 5;
        function onLoad() {
          loaded++;
          if (loaded === total) callback();
        }

        images.belt = new Image();
        images.belt.crossOrigin = "anonymous";
        images.belt.onload = onLoad;
        images.belt.onerror = onLoad;
        images.belt.src =
          "https://ts4.tc.mm.bing.net/th/id/OIP-C.XVn3IrtbhTyHcJHrWyKqTgAAAA?r=0&rs=1&pid=ImgDetMain&o=7&rm=3";

        images.pot = new Image();
        images.pot.crossOrigin = "anonymous";
        images.pot.onload = onLoad;
        images.pot.onerror = onLoad;
        images.pot.src =
          "https://ts2.tc.mm.bing.net/th/id/OIP-C.9bVtoHTBQRCsKukxxEl-bgAAAA?r=0&rs=1&pid=ImgDetMain&o=7&rm=3";

        images.dish = new Image();
        images.dish.crossOrigin = "anonymous";
        images.dish.onload = onLoad;
        images.dish.onerror = onLoad;
        images.dish.src =
          "https://ts2.tc.mm.bing.net/th/id/OIP-C.9bVtoHTBQRCsKukxxEl-bgAAAA?r=0&rs=1&pid=ImgDetMain&o=7&rm=3 "; // 替换为成品菜链接

        images.leftTable = new Image();
        images.leftTable.crossOrigin = "anonymous";
        images.leftTable.onload = onLoad;
        images.leftTable.onerror = onLoad;
        images.leftTable.src =
          "https://ts2.tc.mm.bing.net/th/id/OIP-C.9bVtoHTBQRCsKukxxEl-bgAAAA?r=0&rs=1&pid=ImgDetMain&o=7&rm=3 "; // 替换为左桌链接

        images.rightTable = new Image();
        images.rightTable.crossOrigin = "anonymous";
        images.rightTable.onload = onLoad;
        images.rightTable.onerror = onLoad;
        images.rightTable.src =
          "https://ts2.tc.mm.bing.net/th/id/OIP-C.9bVtoHTBQRCsKukxxEl-bgAAAA?r=0&rs=1&pid=ImgDetMain&o=7&rm=3 "; // 替换为右桌链接
      }

      // ---------- 绘制函数 ----------
      function drawGame() {
        const W = canvas.width,
          H = canvas.height;
        const cellW = W / COLS,
          cellH = H / ROWS;

        ctx.clearRect(0, 0, W, H);

        // 背景
        ctx.fillStyle = "#fdf8f0";
        ctx.fillRect(0, 0, W, H);

        // 网格线
        ctx.strokeStyle = "rgba(200, 190, 175, 0.2)";
        ctx.lineWidth = 1;
        for (let r = 0; r <= ROWS; r++) {
          ctx.beginPath();
          ctx.moveTo(0, r * cellH);
          ctx.lineTo(W, r * cellH);
          ctx.stroke();
        }
        for (let c = 0; c <= COLS; c++) {
          ctx.beginPath();
          ctx.moveTo(c * cellW, 0);
          ctx.lineTo(c * cellW, H);
          ctx.stroke();
        }

        // ---------- 传输带区域 ----------
        const beltTop = cellH * 1.5;
        const beltBottom = cellH * 6.8;
        const beltHeight = beltBottom - beltTop;

        ctx.fillStyle = "rgba(200, 190, 175, 0.3)";
        ctx.fillRect(0, beltTop, W, beltHeight);

        // 传送带图片向下滚动
        if (
          images.belt &&
          images.belt.complete &&
          images.belt.naturalWidth > 0
        ) {
          const imgH = beltHeight;
          // 取模得到当前偏移（0 ~ imgH）
          const offset = state.beltOffset % imgH;
          // 绘制第一张（从 beltTop - offset 开始，向下移动）
          ctx.drawImage(images.belt, 0, beltTop - offset, W, imgH);
          // 绘制第二张接在后面
          ctx.drawImage(images.belt, 0, beltTop - offset + imgH, W, imgH);
        }

        // 滚动条纹（与图片同步）
        const stripeOffset = state.beltOffset % 30;
        for (
          let y = beltTop - 30 + stripeOffset;
          y < beltBottom + 30;
          y += 30
        ) {
          ctx.fillStyle = "rgba(160, 150, 135, 0.15)";
          ctx.fillRect(0, y, W, 4);
          ctx.fillStyle = "rgba(180, 170, 155, 0.10)";
          ctx.fillRect(0, y + 15, W, 4);
        }

        // ---------- 左右轨道 ----------
        const leftTrackX = cellW * 0.7;
        const rightTrackX = cellW * 2.7;
        ctx.fillStyle = "rgba(231, 76, 60, 0.08)";
        ctx.fillRect(leftTrackX, beltTop, cellW * 1.4, beltHeight);
        ctx.fillStyle = "rgba(52, 152, 219, 0.08)";
        ctx.fillRect(rightTrackX, beltTop, cellW * 1.4, beltHeight);

        ctx.fillStyle = "#e67e22";
        ctx.font = '16px "Press Start 2P", monospace';
        for (let y = beltTop + 30; y < beltBottom - 20; y += 50) {
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText("▼", leftTrackX + cellW * 0.7, y);
          ctx.fillText("▼", rightTrackX + cellW * 0.7, y);
        }

        // ---------- 食材 ----------
        state.ingredients.forEach((ing) => {
          if (!ing.alive) return;
          const size = ing.size;
          const x = ing.x,
            y = ing.y;
          const glow = ctx.createRadialGradient(x, y, 0, x, y, size * 1.6);
          glow.addColorStop(0, ing.color + "60");
          glow.addColorStop(1, ing.color + "00");
          ctx.fillStyle = glow;
          ctx.beginPath();
          ctx.arc(x, y, size * 1.6, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowColor = "rgba(0,0,0,0.1)";
          ctx.shadowBlur = 8;
          ctx.beginPath();
          ctx.arc(x, y, size, 0, Math.PI * 2);
          ctx.fillStyle = ing.color;
          ctx.fill();
          ctx.shadowBlur = 0;
          ctx.strokeStyle = "rgba(255,255,255,0.5)";
          ctx.lineWidth = 2;
          ctx.stroke();
          ctx.font = `${size * 1.0}px serif`;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillStyle = "#fff";
          ctx.shadowBlur = 6;
          ctx.shadowColor = "rgba(0,0,0,0.2)";
          ctx.fillText(ing.emoji, x, y + 1);
          ctx.shadowBlur = 0;
        });

        // ---------- 厨师位置：直接显示摄像头视频 ----------
        const chefX = state.chefX * W;
        const chefY = cellH * 5.2;
        const chefSize = cellH * 1.6;

        // 绘制视频画面（矩形）
        if (video.readyState >= 2 && video.videoWidth > 0) {
          // 计算比例，使视频填充厨师区域
          const aspect = video.videoWidth / video.videoHeight;
          let drawW, drawH, dx, dy;
          // 适应 chefSize 大小
          const targetW = chefSize * 0.9;
          const targetH = chefSize * 1.1;
          if (aspect > 1) {
            drawW = targetW;
            drawH = drawW / aspect;
            dx = -drawW / 2;
            dy = -chefSize * 0.5 - drawH / 2;
          } else {
            drawH = targetH;
            drawW = drawH * aspect;
            dx = -drawW / 2;
            dy = -chefSize * 0.5 - drawH / 2;
          }
          // 为了更清晰，适当放大
          const scale = 1.2;
          drawW *= scale;
          drawH *= scale;
          dx = -drawW / 2;
          dy = -chefSize * 0.5 - drawH / 2;

          ctx.save();
          ctx.translate(chefX, chefY + chefSize * 0.4);
          ctx.drawImage(video, dx, dy, drawW, drawH);
          ctx.restore();
        } else {
          // 视频未就绪，显示占位
          ctx.save();
          ctx.translate(chefX, chefY + chefSize * 0.4);
          ctx.beginPath();
          ctx.arc(0, -chefSize * 0.25, chefSize * 0.4, 0, Math.PI * 2);
          ctx.fillStyle = "#d5d5d5";
          ctx.fill();
          ctx.strokeStyle = "#b0a898";
          ctx.lineWidth = 2;
          ctx.stroke();
          ctx.font = "24px serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillStyle = "#7a7268";
          ctx.fillText("📷", 0, -chefSize * 0.25);
          ctx.restore();
        }

        // ---------- 抬头时显示“一盘菜” ----------
        if (state.menuComplete && state.isPlaying) {
          ctx.save();
          if (
            images.dish &&
            images.dish.complete &&
            images.dish.naturalWidth > 0
          ) {
            ctx.drawImage(
              images.dish,
              chefX - 30,
              chefY - chefSize * 1.4,
              60,
              60,
            );
          } else {
            ctx.font = "48px serif";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.shadowColor = "rgba(0,0,0,0.2)";
            ctx.shadowBlur = 20;
            ctx.fillText("🍳", chefX, chefY - chefSize * 1.2);
            ctx.shadowBlur = 0;
          }
          ctx.restore();
        }

        // ---------- 锅 ----------
        const potX = chefX;
        const potY = cellH * 6.2;
        const potW = cellW * 1.0;
        const potH = cellH * 0.7;

        ctx.shadowColor = "rgba(0,0,0,0.08)";
        ctx.shadowBlur = 12;
        if (images.pot && images.pot.complete && images.pot.naturalWidth > 0) {
          ctx.drawImage(
            images.pot,
            potX - potW * 0.6,
            potY - potH * 0.5,
            potW * 1.2,
            potH,
          );
        }
        ctx.shadowBlur = 0;

        const potItems = Object.keys(state.pot).filter(
          (key) => state.pot[key] > 0,
        );
        if (potItems.length > 0) {
          let emojiStr = "";
          potItems.forEach((key) => {
            const ing = INGREDIENT_TYPES.find((i) => i.id === key);
            if (ing) emojiStr += ing.emoji + " ";
          });
          ctx.font = "20px serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillStyle = "#2c3e50";
          ctx.fillText(emojiStr.trim() || "🍲", potX, potY - potH * 0.1);
        } else {
          ctx.font = "18px serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillStyle = "#bdc3c7";
          ctx.fillText("🥘", potX, potY - potH * 0.05);
        }

        // ---------- 菜单 ----------
        const menuX = cellW * 2.6;
        const menuY = cellH * 5.2;
        const menuW = cellW * 1.0;
        const menuH = cellH * 1.6;

        ctx.fillStyle = "rgba(255, 248, 240, 0.95)";
        ctx.shadowBlur = 10;
        ctx.shadowColor = "rgba(0,0,0,0.05)";
        ctx.beginPath();
        ctx.roundRect(menuX, menuY, menuW, menuH, 8);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = "#d0c8b8";
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.roundRect(menuX, menuY, menuW, menuH, 8);
        ctx.stroke();

        ctx.font = 'bold 9px "Press Start 2P", monospace';
        ctx.textAlign = "center";
        ctx.textBaseline = "top";
        ctx.fillStyle = "#e67e22";
        ctx.fillText("📋 " + state.dishName, menuX + menuW / 2, menuY + 4);

        if (state.menuComplete) {
          ctx.font = "28px serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillStyle = "#2ecc71";
          ctx.fillText("✅", menuX + menuW / 2, menuY + menuH / 2);
          ctx.font = '7px "Press Start 2P", monospace';
          ctx.fillStyle = "#e67e22";
          ctx.fillText("👆 抬头出餐!", menuX + menuW / 2, menuY + menuH - 14);
        } else {
          let yOff = 16;
          state.menu.forEach((item) => {
            const ing = INGREDIENT_TYPES.find((i) => i.id === item.id);
            const collected = state.pot[item.id] || 0;
            const needed = item.count;
            ctx.font = '7px "Press Start 2P", monospace';
            ctx.textAlign = "left";
            ctx.textBaseline = "top";
            ctx.fillStyle = "#3d3a36";
            const label = `${ing ? ing.emoji : "🍽"} ${ing ? ing.name : ""}`;
            ctx.fillText(label, menuX + 6, menuY + yOff);
            // 进度条：只显示彩色条 + 边框，无灰色背景
            const barX = menuX + 62;
            const barY = menuY + yOff + 2;
            const barW = menuW - 74;
            const barH = 8;
            // 先画边框（充当背景）
            ctx.strokeStyle = "#bdc3c7";
            ctx.lineWidth = 1.5;
            ctx.strokeRect(barX, barY, barW, barH);
            // 再画彩色填充
            const fillW = (collected / needed) * barW;
            ctx.fillStyle = collected >= needed ? "#2ecc71" : "#f1c40f";
            ctx.fillRect(barX, barY, Math.min(fillW, barW), barH);
            // 数字
            ctx.fillStyle = "#3d3a36";
            ctx.textAlign = "right";
            ctx.textBaseline = "top";
            ctx.font = '6px "Press Start 2P", monospace';
            ctx.fillText(
              `${collected}/${needed}`,
              menuX + menuW - 6,
              menuY + yOff,
            );
            yOff += 18;
          });
        }

        // ---------- 餐厅区域（实色） ----------
        const restaurantTop = cellH * 7.3;
        const restaurantBottom = cellH * 9.8;
        const restaurantH = restaurantBottom - restaurantTop;

        ctx.fillStyle = "#e8ddd0";
        ctx.shadowBlur = 6;
        ctx.shadowColor = "rgba(0,0,0,0.05)";
        ctx.beginPath();
        ctx.roundRect(0, restaurantTop, W, restaurantH, 8);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.strokeStyle = "#d0c8b8";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.roundRect(0, restaurantTop, W, restaurantH, 8);
        ctx.stroke();

        ctx.strokeStyle = "#d0c8b8";
        ctx.lineWidth = 2;
        ctx.setLineDash([6, 6]);
        ctx.beginPath();
        ctx.moveTo(W / 2, restaurantTop);
        ctx.lineTo(W / 2, restaurantBottom);
        ctx.stroke();
        ctx.setLineDash([]);

        // 左桌
        const leftTableX = cellW * 0.2;
        const leftTableW = cellW * 1.6;
        const leftTableY = restaurantTop + restaurantH * 0.2;
        const leftTableH = restaurantH * 0.6;

        if (
          images.leftTable &&
          images.leftTable.complete &&
          images.leftTable.naturalWidth > 0
        ) {
          ctx.drawImage(
            images.leftTable,
            leftTableX,
            leftTableY,
            leftTableW,
            leftTableH,
          );
        } else {
          ctx.fillStyle = "#c9b8a8";
          ctx.shadowBlur = 6;
          ctx.shadowColor = "rgba(0,0,0,0.05)";
          ctx.beginPath();
          ctx.roundRect(leftTableX, leftTableY, leftTableW, leftTableH, 8);
          ctx.fill();
          ctx.shadowBlur = 0;
          ctx.strokeStyle = "#b0a898";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.roundRect(leftTableX, leftTableY, leftTableW, leftTableH, 8);
          ctx.stroke();
        }

        const chairY = leftTableY + leftTableH + 6;
        ctx.font = "20px serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "#7f8c8d";
        ctx.fillText("🪑", leftTableX + 20, chairY);
        ctx.fillText("🪑", leftTableX + 20, chairY + 24);
        ctx.fillText("🪑", leftTableX + leftTableW - 20, chairY);
        ctx.fillText("🪑", leftTableX + leftTableW - 20, chairY + 24);

        if (state.leftDemand) {
          const bubbleX = leftTableX + 10;
          const bubbleY = leftTableY - 30;
          ctx.fillStyle = "rgba(255,255,240,0.95)";
          ctx.shadowBlur = 8;
          ctx.shadowColor = "rgba(0,0,0,0.1)";
          ctx.beginPath();
          ctx.roundRect(bubbleX, bubbleY, 60, 40, 12);
          ctx.fill();
          ctx.shadowBlur = 0;
          ctx.strokeStyle = "#f1c40f";
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.roundRect(bubbleX, bubbleY, 60, 40, 12);
          ctx.stroke();
          ctx.font = "28px serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillStyle = "#2c3e50";
          ctx.fillText(state.leftDemand.emoji, bubbleX + 30, bubbleY + 18);
          ctx.font = '7px "Press Start 2P", monospace';
          ctx.fillStyle = "#e67e22";
          ctx.fillText(state.leftDemand.dish, bubbleX + 30, bubbleY + 34);
        }

        // 右桌
        const rightTableX = cellW * 2.2;
        const rightTableW = cellW * 1.6;
        const rightTableY = restaurantTop + restaurantH * 0.2;
        const rightTableH = restaurantH * 0.6;

        if (
          images.rightTable &&
          images.rightTable.complete &&
          images.rightTable.naturalWidth > 0
        ) {
          ctx.drawImage(
            images.rightTable,
            rightTableX,
            rightTableY,
            rightTableW,
            rightTableH,
          );
        } else {
          ctx.fillStyle = "#b8c8d0";
          ctx.shadowBlur = 6;
          ctx.shadowColor = "rgba(0,0,0,0.05)";
          ctx.beginPath();
          ctx.roundRect(rightTableX, rightTableY, rightTableW, rightTableH, 8);
          ctx.fill();
          ctx.shadowBlur = 0;
          ctx.strokeStyle = "#b0a898";
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.roundRect(rightTableX, rightTableY, rightTableW, rightTableH, 8);
          ctx.stroke();
        }

        ctx.font = "20px serif";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillStyle = "#7f8c8d";
        ctx.fillText("🪑", rightTableX + 20, chairY);
        ctx.fillText("🪑", rightTableX + 20, chairY + 24);
        ctx.fillText("🪑", rightTableX + rightTableW - 20, chairY);
        ctx.fillText("🪑", rightTableX + rightTableW - 20, chairY + 24);

        if (state.rightDemand) {
          const bubbleX = rightTableX + rightTableW - 70;
          const bubbleY = rightTableY - 30;
          ctx.fillStyle = "rgba(255,255,240,0.95)";
          ctx.shadowBlur = 8;
          ctx.shadowColor = "rgba(0,0,0,0.1)";
          ctx.beginPath();
          ctx.roundRect(bubbleX, bubbleY, 60, 40, 12);
          ctx.fill();
          ctx.shadowBlur = 0;
          ctx.strokeStyle = "#f1c40f";
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.roundRect(bubbleX, bubbleY, 60, 40, 12);
          ctx.stroke();
          ctx.font = "28px serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillStyle = "#2c3e50";
          ctx.fillText(state.rightDemand.emoji, bubbleX + 30, bubbleY + 18);
          ctx.font = '7px "Press Start 2P", monospace';
          ctx.fillStyle = "#e67e22";
          ctx.fillText(state.rightDemand.dish, bubbleX + 30, bubbleY + 34);
        }

        // ---------- 顶部信息 ----------
        const minutes = Math.floor(state.timeLeft / 60);
        const seconds = Math.floor(state.timeLeft % 60);
        const timeStr = `${String(minutes).padStart(2, "0")}:${String(seconds).padStart(2, "0")}`;

        ctx.font = 'bold 16px "Press Start 2P", monospace';
        ctx.textAlign = "left";
        ctx.textBaseline = "top";
        ctx.fillStyle = "#2c3e50";
        ctx.fillText("⏱ " + timeStr, 14, 10);

        ctx.textAlign = "center";
        ctx.font = 'bold 14px "Press Start 2P", monospace';
        ctx.fillStyle = "#e67e22";
        ctx.fillText("⭐ " + state.score, W / 2, 12);

        ctx.textAlign = "right";
        ctx.textBaseline = "top";
        ctx.font = '22px "Press Start 2P", monospace';
        ctx.fillStyle = "#2c3e50";
        ctx.fillText("⏸", W - 16, 6);

        if (state.combo > 1) {
          ctx.textAlign = "center";
          ctx.textBaseline = "top";
          ctx.font = 'bold 11px "Press Start 2P", monospace';
          ctx.fillStyle = "#e74c3c";
          ctx.fillText("🔥 x" + state.combo, W / 2, 38);
        }

        ctx.textAlign = "right";
        ctx.textBaseline = "top";
        ctx.font = '9px "Press Start 2P", monospace';
        ctx.fillStyle = "#7a7268";
        ctx.fillText("🧺 " + state.ingredientsCollected, W - 14, 38);

        ctx.textAlign = "left";
        ctx.textBaseline = "bottom";
        ctx.font = '7px "Press Start 2P", monospace';
        ctx.fillStyle = "#b0a898";
        ctx.fillText("←歪头  ·  抬头→", 10, H - 8);
      }

      // ---- roundRect polyfill ----
      if (!CanvasRenderingContext2D.prototype.roundRect) {
        CanvasRenderingContext2D.prototype.roundRect = function (
          x,
          y,
          w,
          h,
          radii,
        ) {
          const r = typeof radii === "number" ? radii : radii || 0;
          this.moveTo(x + r, y);
          this.arcTo(x + w, y, x + w, y + h, r);
          this.arcTo(x + w, y + h, x, y + h, r);
          this.arcTo(x, y + h, x, y, r);
          this.arcTo(x, y, x + w, y, r);
          return this;
        };
      }

      function updateUI() {}

      // ---------- 游戏循环 ----------
      let lastTimestamp = 0;
      function gameLoop(timestamp) {
        const delta = lastTimestamp
          ? Math.min((timestamp - lastTimestamp) / 1000, 0.05)
          : 0.016;
        lastTimestamp = timestamp;
        updateGame(delta);
        drawGame();
        requestAnimationFrame(gameLoop);
      }

      // ---------- 结束游戏 ----------
      function endGame() {
        if (state.isGameOver) return;
        state.isGameOver = true;
        state.isPlaying = false;
        stopBGM();
        finalScoreEl.textContent = state.score;
        statDishesEl.textContent = state.dishesServed;
        statIngredientsEl.textContent = state.ingredientsCollected;
        statComboEl.textContent = state.maxCombo;
        resultModal.classList.remove("hidden");
      }

      // ---------- 重置 ----------
      function resetGame() {
        if (video.srcObject) {
          video.srcObject.getTracks().forEach((track) => track.stop());
          video.srcObject = null;
        }
        state.cameraReady = false;
        state.isPlaying = false;
        state.isPaused = false;
        state.isGameOver = false;
        state.timeLeft = GAME_DURATION;
        state.score = 0;
        state.dishesServed = 0;
        state.ingredientsCollected = 0;
        state.combo = 0;
        state.maxCombo = 0;
        state.chefX = 0.5;
        state.targetX = 0.5;
        state.headX = 0.5;
        state.headY = 0.5;
        state.isHeadUp = false;
        state.ingredients = [];
        state.pot = {};
        state.menu = [];
        state.menuComplete = false;
        state.dishName = "";
        state.leftDemand = null;
        state.rightDemand = null;
        state.queueTimer = 0;
        state.beltOffset = 0;
        if (state.timerInterval) {
          clearInterval(state.timerInterval);
          state.timerInterval = null;
        }
        resultModal.classList.add("hidden");
        pauseModal.classList.add("hidden");
        startOverlay.classList.remove("hidden");
        generateMenu();
        updateUI();
      }

      // ---------- 开始游戏 ----------
      function startGame() {
        resetGame();
        state.isPlaying = true;
        state.isGameOver = false;
        startOverlay.classList.add("hidden");
        pauseModal.classList.add("hidden");
        resultModal.classList.add("hidden");
        generateMenu();
        startBGM();
        if (state.timerInterval) clearInterval(state.timerInterval);
        state.timerInterval = setInterval(() => {}, 1000);
        updateUI();
      }

      // ---------- 暂停 ----------
      function togglePause() {
        if (!state.isPlaying || state.isGameOver) return;
        state.isPaused = !state.isPaused;
        if (state.isPaused) {
          pauseModal.classList.remove("hidden");
          stopBGM();
        } else {
          pauseModal.classList.add("hidden");
          startBGM();
        }
      }

      // ---------- MediaPipe 初始化 ----------
      function initFaceMesh() {
        const faceMesh = new FaceMesh({
          locateFile: (file) =>
            `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`,
        });
        faceMesh.setOptions({
          maxNumFaces: 1,
          refineLandmarks: true,
          minDetectionConfidence: 0.6,
          minTrackingConfidence: 0.5,
        });
        faceMesh.onResults((results) => {
          if (
            results.multiFaceLandmarks &&
            results.multiFaceLandmarks.length > 0
          ) {
            const nose = results.multiFaceLandmarks[0][1];
            if (nose) {
              const rawX = nose.x;
              const rawY = nose.y;
              state.headX = clamp(rawX, 0, 1);
              state.headY = clamp(rawY, 0, 1);

              let target = 0.5;
              const x = state.headX;
              if (x < 0.4) {
                target = 0.1 + (x / 0.4) * 0.3;
              } else if (x > 0.6) {
                target = 0.9 - ((1 - x) / 0.4) * 0.3;
              } else {
                target = 0.3 + ((x - 0.4) / 0.2) * 0.4;
              }
              state.targetX = clamp(target, 0.05, 0.95);
            }
          }
        });
        return faceMesh;
      }

      // ---------- 启动摄像头 ----------
      async function startCamera() {
        if (video.srcObject) {
          video.srcObject.getTracks().forEach((track) => track.stop());
          video.srcObject = null;
        }
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "user", width: 320, height: 240 },
          });
          video.srcObject = stream;
          await video.play();

          const faceMesh = initFaceMesh();
          state.faceMesh = faceMesh;
          const camera = new Camera(video, {
            onFrame: async () => {
              try {
                await faceMesh.send({ image: video });
              } catch (_) {}
            },
            width: 320,
            height: 240,
          });
          await camera.start();
          state.cameraReady = true;
          cameraModal.classList.add("hidden");
          startOverlay.classList.remove("hidden");
          initAudio();
          console.log("✅ 摄像头启动成功，头部追踪已启用");
          return true;
        } catch (err) {
          console.error(err);
          let msg = "无法访问摄像头: ";
          if (err.name === "NotAllowedError") msg += "权限被拒绝。";
          else if (err.name === "NotFoundError") msg += "未检测到摄像头。";
          else if (err.name === "NotReadableError") msg += "摄像头被占用。";
          else if (err.name === "AbortError") msg += "启动被中止，请刷新。";
          else if (err.name === "SecurityError")
            msg += "安全错误，请使用 HTTPS。";
          else msg += err.message;
          alert(msg);
          return false;
        }
      }

      // ---------- 事件绑定 ----------
      cameraAllowBtn.addEventListener("click", async () => {
        await startCamera();
      });

      startGameBtn.addEventListener("click", () => {
        if (!state.cameraReady) {
          alert("请先允许摄像头权限");
          return;
        }
        startGame();
      });

      canvas.addEventListener("click", (e) => {
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX - rect.left) / rect.width,
          y = (e.clientY - rect.top) / rect.height;
        if (x > 0.7 && y < 0.12) {
          if (state.isPlaying && !state.isGameOver) togglePause();
        }
      });

      resumeBtn.addEventListener("click", () => {
        if (state.isPaused) togglePause();
      });
      surrenderBtn.addEventListener("click", () => {
        if (state.isPlaying) {
          state.isPlaying = false;
          state.isGameOver = true;
          pauseModal.classList.add("hidden");
          endGame();
        }
      });
      retryBtn.addEventListener("click", () => {
        resetGame();
        startGame();
      });

      document.querySelectorAll(".toggle-btn").forEach((btn) => {
        btn.addEventListener("click", function () {
          const setting = this.dataset.setting,
            val = this.dataset.val;
          const parent = this.closest(".toggle-wrap");
          parent
            .querySelectorAll(".toggle-btn")
            .forEach((b) => b.classList.remove("active"));
          this.classList.add("active");
          if (setting === "bgm") {
            bgmEnabled = val === "on";
            if (bgmEnabled && state.isPlaying && !state.isPaused) startBGM();
            else if (!bgmEnabled) stopBGM();
          } else if (setting === "sfx") {
            sfxEnabled = val === "on";
          }
        });
      });

      // 键盘调试
      document.addEventListener("keydown", (e) => {
        if (e.key === "ArrowLeft") state.targetX = 0.15;
        else if (e.key === "ArrowRight") state.targetX = 0.85;
        else if (e.key === "ArrowUp") serveDish();
        else if (e.key === " ") {
          e.preventDefault();
          togglePause();
        }
      });
      document.addEventListener("keyup", (e) => {
        if (e.key === "ArrowLeft" || e.key === "ArrowRight")
          state.targetX = 0.5;
      });

      // ---------- 初始化 ----------
      function init() {
        loadImages(() => {
          resetGame();
          cameraModal.classList.remove("hidden");
          startOverlay.classList.add("hidden");
          pauseModal.classList.add("hidden");
          resultModal.classList.add("hidden");
          requestAnimationFrame(gameLoop);
        });
      }
      init();
      document.addEventListener(
        "click",
        () => {
          initAudio();
        },
        { once: true },
      );
      console.log("🍳 像素厨房已加载（传送带向下 + 视频可见 + 触发修复）");
    </script>
  </body>
</html>
