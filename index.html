<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>像素厨房 · 头控做菜</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
      body {
        background: #f5efe6;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        font-family: "Press Start 2P", monospace;
        touch-action: none;
      }
      #game-wrapper {
        position: relative;
        width: 100%;
        max-width: 420px;
        aspect-ratio: 9 / 16;
        background: #fdf8f0;
        border-radius: 20px;
        overflow: hidden;
        box-shadow:
          0 8px 0 #d0c8b8,
          0 12px 40px rgba(0, 0, 0, 0.1);
        margin: 12px;
        border: 4px solid #d0c8b8;
      }
      #gameCanvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: block;
        z-index: 2;
        image-rendering: pixelated;
        touch-action: none;
      }
      #webcam {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: 1;
        opacity: 0.01;
        pointer-events: none;
        transform: scaleX(-1);
      }
      .modal-overlay {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(255, 248, 240, 0.88);
        backdrop-filter: blur(4px);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 100;
        padding: 24px;
        animation: fadeIn 0.3s ease;
      }
      .modal-overlay.hidden {
        display: none;
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: scale(0.96);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      .modal-card {
        background: #ffffff;
        border-radius: 16px;
        padding: 28px 24px 32px;
        max-width: 360px;
        width: 100%;
        text-align: center;
        color: #3d3a36;
        border: 4px solid #d0c8b8;
        box-shadow:
          0 8px 0 #b0a898,
          0 12px 30px rgba(0, 0, 0, 0.08);
        font-family: "Press Start 2P", monospace;
      }
      .modal-card h2 {
        font-size: 22px;
        font-weight: 700;
        margin-bottom: 12px;
        color: #e67e22;
        text-shadow: 2px 2px 0 #f1c40f;
      }
      .modal-card p {
        font-size: 12px;
        color: #5a5248;
        line-height: 1.8;
        margin: 12px 0 20px;
      }
      .modal-card .btn {
        display: inline-block;
        padding: 14px 32px;
        background: #f39c12;
        border: 4px solid #d68910;
        border-radius: 8px;
        font-size: 14px;
        font-weight: bold;
        color: #2c2a26;
        cursor: pointer;
        transition: all 0.05s linear;
        box-shadow: 0 4px 0 #b9770e;
        font-family: "Press Start 2P", monospace;
        letter-spacing: 0.5px;
      }
      .modal-card .btn:active {
        transform: translateY(4px);
        box-shadow: 0 0px 0 #b9770e;
      }
      .modal-card .btn-secondary {
        background: #ecf0f1;
        border-color: #bdc3c7;
        box-shadow: 0 4px 0 #95a5a6;
        color: #2c3e50;
      }
      .modal-card .btn-secondary:active {
        transform: translateY(4px);
        box-shadow: 0 0px 0 #95a5a6;
      }
      .modal-card .btn-group {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: 10px;
      }
      .settings-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 0;
        border-bottom: 2px dotted #d0c8b8;
        font-size: 11px;
      }
      .settings-row:last-child {
        border-bottom: none;
      }
      .toggle-wrap {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .toggle-btn {
        padding: 4px 14px;
        border-radius: 4px;
        border: 2px solid #b0a898;
        background: #f5efe6;
        color: #3d3a36;
        font-size: 10px;
        cursor: pointer;
        font-family: "Press Start 2P", monospace;
        transition: 0.1s;
      }
      .toggle-btn.active {
        background: #f1c40f;
        border-color: #d4ac0d;
        color: #2c2a26;
      }
      .score-number {
        font-size: 56px;
        font-weight: bold;
        color: #e67e22;
        text-shadow: 4px 4px 0 #f1c40f;
        line-height: 1.2;
      }
      .score-label {
        font-size: 12px;
        color: #7a7268;
        letter-spacing: 2px;
        text-transform: uppercase;
      }
      .stat-row {
        display: flex;
        justify-content: center;
        gap: 24px;
        margin: 16px 0 20px;
      }
      .stat-item .num {
        font-size: 24px;
        font-weight: bold;
        color: #2c3e50;
      }
      .stat-item .label {
        font-size: 10px;
        color: #7a7268;
      }
      @media (max-width: 440px) {
        .modal-card {
          padding: 20px 16px 24px;
        }
        .modal-card h2 {
          font-size: 18px;
        }
        .score-number {
          font-size: 40px;
        }
      }
      .calibrate-grid {
        display: flex;
        gap: 16px;
        align-items: center;
        margin-bottom: 16px;
      }
      .calibrate-video-wrap {
        position: relative;
        width: 120px;
        height: 90px;
        border-radius: 8px;
        overflow: hidden;
        border: 2px solid #d0c8b8;
        flex-shrink: 0;
        background: #000;
      }
      .calibrate-video-wrap video {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
        transform: scaleX(-1);
      }
      .calibrate-video-wrap canvas {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        transform: scaleX(-1);
      }
      .calibrate-text {
        flex: 1;
        text-align: left;
        font-size: 10px;
        line-height: 1.6;
        color: #5a5248;
      }
      .calibrate-text .highlight {
        color: #e67e22;
        font-weight: bold;
      }
      @media (max-width: 400px) {
        .calibrate-grid {
          flex-direction: column;
          align-items: center;
        }
        .calibrate-video-wrap {
          width: 160px;
          height: 120px;
        }
      }
      /* 调试：实时头控数值显示 */
      .debug-panel {
        position: absolute;
        top: 8px;
        left: 8px;
        color: #e74c3c;
        font-family: "Press Start 2P", monospace;
        font-size: 10px;
        background: rgba(255, 255, 240, 0.9);
        padding: 4px 8px;
        border-radius: 4px;
        z-index: 10;
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="game-wrapper">
      <canvas id="gameCanvas"></canvas>
      <video id="webcam" playsinline muted></video>

      <!-- 调试面板，可隐藏 -->
      <div id="debugPanel" class="debug-panel">
        <div id="debugStatus">⚪ 未检测到</div>
        <div id="debugTilt">倾斜: 0.00</div>
      </div>

      <div id="cameraModal" class="modal-overlay">
        <div class="modal-card">
          <h2>📷 开启摄像头</h2>
          <p>
            向左歪头 → 接左道食材<br />向右歪头 → 接右道食材<br />抬头 →
            出餐上菜
          </p>
          <button class="btn" id="cameraAllowBtn">📸 允许并开始</button>
          <div style="margin-top: 14px; font-size: 9px; color: #7a7268">
            仅用于头部追踪
          </div>
        </div>
      </div>

      <div id="calibrateModal" class="modal-overlay hidden">
        <div class="modal-card" style="max-width: 400px">
          <h2>🎯 鼻梁校准</h2>
          <div class="calibrate-grid">
            <div class="calibrate-video-wrap" id="calibrateVideoWrap">
              <video id="calibrateVideo" playsinline muted></video>
              <canvas id="calibrateOverlay" width="160" height="120"></canvas>
            </div>
            <div class="calibrate-text">
              <p>请将头部摆正，<br />眼睛直视屏幕中心。</p>
              <p>
                <span class="highlight">🔴 红线</span>
                追踪鼻梁倾斜，<br />摆正后点击下方按钮。
              </p>
            </div>
          </div>
          <button class="btn" id="calibrateBtn">✅ 已摆正，开始游戏</button>
        </div>
      </div>

      <div id="pauseModal" class="modal-overlay hidden">
        <div class="modal-card">
          <h2>⏸ 暂停</h2>
          <div style="margin: 16px 0 4px">
            <div class="settings-row">
              <span>🎵 音乐</span>
              <div class="toggle-wrap">
                <button
                  class="toggle-btn active"
                  data-setting="bgm"
                  data-val="on"
                >
                  开</button
                ><button class="toggle-btn" data-setting="bgm" data-val="off">
                  关
                </button>
              </div>
            </div>
            <div class="settings-row">
              <span>🔊 音效</span>
              <div class="toggle-wrap">
                <button
                  class="toggle-btn active"
                  data-setting="sfx"
                  data-val="on"
                >
                  开</button
                ><button class="toggle-btn" data-setting="sfx" data-val="off">
                  关
                </button>
              </div>
            </div>
          </div>
          <div class="btn-group">
            <button class="btn" id="resumeBtn">▶ 继续</button
            ><button class="btn btn-secondary" id="surrenderBtn">
              🏳️ 认输
            </button>
          </div>
        </div>
      </div>

      <div id="resultModal" class="modal-overlay hidden">
        <div class="modal-card">
          <h2>🍳 时间到！</h2>
          <div class="score-number" id="finalScore">0</div>
          <div class="score-label">总金币</div>
          <div class="stat-row">
            <div class="stat-item">
              <div class="num" id="statDishes">0</div>
              <div class="label">出餐</div>
            </div>
            <div class="stat-item">
              <div class="num" id="statIngredients">0</div>
              <div class="label">食材</div>
            </div>
            <div class="stat-item">
              <div class="num" id="statCombo">0</div>
              <div class="label">连击</div>
            </div>
          </div>
          <button class="btn" id="retryBtn">🔄 再来一局</button>
        </div>
      </div>

      <div
        id="startOverlay"
        class="modal-overlay hidden"
        style="background: rgba(255, 248, 240, 0.75)"
      >
        <div class="modal-card" style="background: #fffefc">
          <h2>👨‍🍳 像素厨房</h2>
          <p style="font-size: 11px">头部控制 · 接食材 · 做菜上桌</p>
          <button class="btn" id="startGameBtn">🔥 开始游戏</button>
          <div style="margin-top: 14px; font-size: 9px; color: #7a7268">
            ←歪头移动 · 抬头出餐→
          </div>
        </div>
      </div>
    </div>

    <script>
      // ============ 厨师大冒险 - 纯头控版 ============
      if (typeof FaceMesh === "undefined") {
        alert("⚠️ 关键库加载失败，请检查网络。");
        throw new Error("FaceMesh not loaded");
      }

      const canvas = document.getElementById("gameCanvas");
      const ctx = canvas.getContext("2d");
      const video = document.getElementById("webcam");
      const calibrateVideo = document.getElementById("calibrateVideo");
      const calibrateOverlay = document.getElementById("calibrateOverlay");
      const overlayCtx = calibrateOverlay.getContext("2d");
      const debugStatus = document.getElementById("debugStatus");
      const debugTilt = document.getElementById("debugTilt");

      const cameraModal = document.getElementById("cameraModal");
      const calibrateModal = document.getElementById("calibrateModal");
      const pauseModal = document.getElementById("pauseModal");
      const resultModal = document.getElementById("resultModal");
      const startOverlay = document.getElementById("startOverlay");
      const cameraAllowBtn = document.getElementById("cameraAllowBtn");
      const calibrateBtn = document.getElementById("calibrateBtn");
      const startGameBtn = document.getElementById("startGameBtn");
      const resumeBtn = document.getElementById("resumeBtn");
      const surrenderBtn = document.getElementById("surrenderBtn");
      const retryBtn = document.getElementById("retryBtn");
      const finalScoreEl = document.getElementById("finalScore");
      const statDishesEl = document.getElementById("statDishes");
      const statIngredientsEl = document.getElementById("statIngredients");
      const statComboEl = document.getElementById("statCombo");

      function resizeCanvas() {
        const rect = canvas.parentElement.getBoundingClientRect();
        canvas.width = rect.width;
        canvas.height = rect.height;
        calibrateOverlay.width = 160;
        calibrateOverlay.height = 120;
      }
      resizeCanvas();
      window.addEventListener("resize", resizeCanvas);

      const ROWS = 10,
        COLS = 4,
        GAME_DURATION = 90;
      const INITIAL_GOLD = 50;

      let audioCtx = null;
      function initAudio() {
        if (!audioCtx)
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      let bgmEnabled = true,
        sfxEnabled = true;

      function playTone(freq, duration, type = "sine", volume = 0.2) {
        if (!sfxEnabled || !audioCtx) return;
        try {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = type;
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(volume, audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(
            0.001,
            audioCtx.currentTime + duration,
          );
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start();
          osc.stop(audioCtx.currentTime + duration);
        } catch (_) {}
      }
      function sfxPickup() {
        playTone(880, 0.08, "sine", 0.15);
      }
      function sfxCook() {
        playTone(660, 0.12, "square", 0.1);
        setTimeout(() => playTone(880, 0.12, "square", 0.1), 120);
      }
      function sfxServe() {
        playTone(1100, 0.1, "sine", 0.18);
        setTimeout(() => playTone(1320, 0.1, "sine", 0.18), 100);
      }
      function sfxMiss() {
        playTone(300, 0.2, "sawtooth", 0.08);
      }
      function sfxCombo() {
        playTone(1000, 0.06, "sine", 0.12);
        setTimeout(() => playTone(1200, 0.06, "sine", 0.12), 80);
        setTimeout(() => playTone(1400, 0.06, "sine", 0.12), 160);
      }
      function sfxGold() {
        playTone(1500, 0.1, "sine", 0.1);
        setTimeout(() => playTone(1800, 0.1, "sine", 0.1), 100);
      }

      let bgmInterval = null;
      function startBGM() {
        if (!bgmEnabled) return;
        stopBGM();
        bgmInterval = setInterval(() => {
          if (!bgmEnabled || !audioCtx) return;
          const freqs = [440, 494, 554, 587, 659, 740, 830, 880];
          const f = freqs[Math.floor(Math.random() * freqs.length)];
          playTone(f, 0.15, "sine", 0.04);
        }, 400);
      }
      function stopBGM() {
        if (bgmInterval) {
          clearInterval(bgmInterval);
          bgmInterval = null;
        }
      }

      const state = {
        isPlaying: false,
        isPaused: false,
        isGameOver: false,
        timeLeft: GAME_DURATION,
        gold: INITIAL_GOLD,
        score: 0,
        dishesServed: 0,
        ingredientsCollected: 0,
        combo: 0,
        maxCombo: 0,
        chefX: 0.5,
        targetX: 0.5,
        headY: 0.5,
        isHeadUp: false,
        ingredients: [],
        pot: {},
        menu: [],
        menuComplete: false,
        dishName: "",
        leftDemand: null,
        rightDemand: null,
        currentRecipeReward: 0,
        currentRecipeCost: 0,
        timerInterval: null,
        queueTimer: 0,
        faceMesh: null,
        beltOffset: 0,
        isCalibrated: false,
        headTilt: 0,
        faceDetected: false,
      };

      const INGREDIENT_TYPES = [
        { id: "tomato", name: "番茄", color: "#e74c3c", emoji: "🍅", cost: 1 },
        { id: "egg", name: "鸡蛋", color: "#f1c40f", emoji: "🥚", cost: 1 },
        { id: "onion", name: "洋葱", color: "#9b59b6", emoji: "🧅", cost: 1 },
        { id: "garlic", name: "大蒜", color: "#ecf0f1", emoji: "🧄", cost: 1 },
        {
          id: "carrot",
          name: "胡萝卜",
          color: "#e67e22",
          emoji: "🥕",
          cost: 1,
        },
        { id: "potato", name: "土豆", color: "#d4a574", emoji: "🥔", cost: 1 },
        { id: "pepper", name: "青椒", color: "#27ae60", emoji: "🫑", cost: 1 },
        {
          id: "mushroom",
          name: "蘑菇",
          color: "#bdc3c7",
          emoji: "🍄",
          cost: 1,
        },
        { id: "salt", name: "盐", color: "#ecf0f1", emoji: "🧂", cost: 1 },
        { id: "oil", name: "油", color: "#f39c12", emoji: "🫒", cost: 1 },
      ];

      const RECIPES = [
        {
          name: "番茄炒蛋",
          emoji: "🍳",
          reward: 25,
          ingredients: [
            { id: "tomato", count: 3 },
            { id: "egg", count: 2 },
            { id: "salt", count: 1 },
          ],
        },
        {
          name: "蛋炒饭",
          emoji: "🍚",
          reward: 20,
          ingredients: [
            { id: "egg", count: 2 },
            { id: "onion", count: 1 },
            { id: "carrot", count: 1 },
            { id: "salt", count: 1 },
          ],
        },
        {
          name: "蔬菜沙拉",
          emoji: "🥗",
          reward: 18,
          ingredients: [
            { id: "tomato", count: 2 },
            { id: "carrot", count: 1 },
            { id: "pepper", count: 1 },
            { id: "onion", count: 1 },
          ],
        },
        {
          name: "蘑菇汤",
          emoji: "🍲",
          reward: 22,
          ingredients: [
            { id: "mushroom", count: 3 },
            { id: "potato", count: 1 },
            { id: "onion", count: 1 },
            { id: "salt", count: 1 },
          ],
        },
        {
          name: "烤土豆",
          emoji: "🥔",
          reward: 15,
          ingredients: [
            { id: "potato", count: 3 },
            { id: "garlic", count: 2 },
            { id: "oil", count: 1 },
          ],
        },
        {
          name: "番茄意面",
          emoji: "🍝",
          reward: 28,
          ingredients: [
            { id: "tomato", count: 3 },
            { id: "onion", count: 1 },
            { id: "garlic", count: 2 },
            { id: "oil", count: 1 },
          ],
        },
      ];

      function rand(min, max) {
        return Math.random() * (max - min) + min;
      }
      function randInt(min, max) {
        return Math.floor(rand(min, max + 1));
      }
      function clamp(v, min, max) {
        return Math.max(min, Math.min(max, v));
      }
      function lerp(a, b, t) {
        return a + (b - a) * t;
      }

      function generateMenu() {
        const recipe = RECIPES[randInt(0, RECIPES.length - 1)];
        state.dishName = recipe.name;
        state.menu = recipe.ingredients.map((item) => ({
          ...item,
          collected: 0,
        }));
        state.menuComplete = false;
        state.pot = {};
        INGREDIENT_TYPES.forEach((ing) => {
          state.pot[ing.id] = 0;
        });
        state.menu.forEach((item) => {
          state.pot[item.id] = 0;
        });
        let totalCost = 0;
        state.menu.forEach((item) => {
          const ingDef = INGREDIENT_TYPES.find((i) => i.id === item.id);
          if (ingDef) totalCost += ingDef.cost * item.count;
        });
        state.currentRecipeReward = recipe.reward;
        state.currentRecipeCost = totalCost;
        state.leftDemand = {
          dish: recipe.name,
          emoji: recipe.emoji,
          side: "left",
        };
        state.rightDemand = null;
        if (Math.random() > 0.5) {
          const other = RECIPES[randInt(0, RECIPES.length - 1)];
          if (other.name !== recipe.name) {
            state.rightDemand = {
              dish: other.name,
              emoji: other.emoji,
              side: "right",
            };
          }
        }
      }

      function checkMenuComplete() {
        if (state.menuComplete) return true;
        let allDone = true;
        state.menu.forEach((item) => {
          if ((state.pot[item.id] || 0) < item.count) allDone = false;
        });
        if (allDone && state.menu.length > 0) {
          state.menuComplete = true;
          sfxCook();
          return true;
        }
        return false;
      }

      function serveDish() {
        if (!state.isPlaying || state.isPaused || state.isGameOver) return;
        if (!state.menuComplete) {
          sfxMiss();
          return;
        }

        const profit = state.currentRecipeReward - state.currentRecipeCost;
        state.gold += profit;
        state.score += profit;
        state.dishesServed++;
        state.combo++;
        if (state.combo > state.maxCombo) state.maxCombo = state.combo;

        let matched = false;
        if (state.leftDemand && state.leftDemand.dish === state.dishName) {
          state.gold += 5;
          state.score += 5;
          matched = true;
          state.leftDemand = null;
          sfxCombo();
        }
        if (state.rightDemand && state.rightDemand.dish === state.dishName) {
          state.gold += 5;
          state.score += 5;
          matched = true;
          state.rightDemand = null;
          sfxCombo();
        }
        if (!matched) sfxServe();
        sfxGold();
        generateMenu();
        if (!matched) state.combo = Math.floor(state.combo / 2);
        if (state.gold < 0) state.gold = 0;
      }

      function queueIngredient() {
        if (!state.isPlaying || state.isPaused || state.isGameOver) return;
        const last = state.ingredients[state.ingredients.length - 1];
        const cellH = canvas.height / ROWS;
        if (last && last.y < cellH * 2.0) return;

        const lane = state.ingredients.length % 2 === 0 ? 0 : 1;
        const typeIdx = randInt(0, INGREDIENT_TYPES.length - 1);
        const type = INGREDIENT_TYPES[typeIdx];
        const cellW = canvas.width / COLS;
        let startX;
        if (lane === 0) startX = cellW * 0.85 + rand(0, cellW * 0.2);
        else startX = cellW * 2.85 + rand(0, cellW * 0.2);

        const ingredient = {
          id: type.id,
          name: type.name,
          color: type.color,
          emoji: type.emoji,
          cost: type.cost,
          lane: lane,
          x: startX,
          y: cellH * 0.2,
          startX: startX,
          speed: 0.8 + rand(0, 0.3),
          size: 32 + rand(0, 8),
          alive: true,
        };
        state.ingredients.push(ingredient);
      }

      function updateIngredients() {
        const cellH = canvas.height / ROWS;
        for (let i = state.ingredients.length - 1; i >= 0; i--) {
          const ing = state.ingredients[i];
          if (!ing.alive) {
            state.ingredients.splice(i, 1);
            continue;
          }

          ing.y += ing.speed * 1.0;
          ing.x = ing.startX + Math.sin(ing.y * 0.02 + Date.now() * 0.0005) * 2;

          if (ing.y > cellH * 7.2) {
            ing.alive = false;
            if (state.combo > 0) state.combo = 0;
            state.ingredients.splice(i, 1);
            continue;
          }

          const chefPixelX = state.chefX * canvas.width;
          const dist = Math.abs(ing.x - chefPixelX);
          const threshold = 55;

          if (dist < threshold && ing.y > cellH * 4.0 && ing.y < cellH * 6.8) {
            if (state.gold < ing.cost) continue;
            state.gold -= ing.cost;
            ing.alive = false;
            state.ingredientsCollected++;
            if (state.pot[ing.id] !== undefined)
              state.pot[ing.id] = (state.pot[ing.id] || 0) + 1;
            else state.pot[ing.id] = 1;
            sfxPickup();
            checkMenuComplete();
            state.ingredients.splice(i, 1);
            continue;
          }

          if (ing.y > cellH * 7.0) {
            ing.alive = false;
            state.ingredients.splice(i, 1);
            if (state.combo > 0) state.combo = 0;
          }
        }
      }

      function updateGame(deltaTime) {
        if (!state.isPlaying || state.isPaused || state.isGameOver) return;
        state.timeLeft -= deltaTime;
        if (state.timeLeft <= 0) {
          state.timeLeft = 0;
          endGame();
          return;
        }

        state.beltOffset += deltaTime * 35;
        state.queueTimer += deltaTime;
        if (state.queueTimer > 0.9 + rand(0, 0.4)) {
          state.queueTimer = 0;
          queueIngredient();
        }
        updateIngredients();

        state.chefX = lerp(state.chefX, state.targetX, 0.18);
        state.chefX = clamp(state.chefX, 0.08, 0.92);

        const headUp = state.headY < 0.35;
        if (headUp && !state.isHeadUp) {
          state.isHeadUp = true;
          serveDish();
        } else if (!headUp) {
          state.isHeadUp = false;
        }
      }

      const images = {
        belt: null,
        pot: null,
        dish: null,
        leftTable: null,
        rightTable: null,
      };

      function loadImages(callback) {
        let loaded = 0;
        const total = 5;
        function onLoad() {
          loaded++;
          if (loaded === total) callback();
        }
        images.belt = new Image();
        images.belt.crossOrigin = "anonymous";
        images.belt.onload = onLoad;
        images.belt.onerror = onLoad;
        images.belt.src =
          "https://ts4.tc.mm.bing.net/th/id/OIP-C.XVn3IrtbhTyHcJHrWyKqTgAAAA?r=0&rs=1&pid=ImgDetMain&o=7&rm=3";
        images.pot = new Image();
        images.pot.crossOrigin = "anonymous";
        images.pot.onload = onLoad;
        images.pot.onerror = onLoad;
        images.pot.src =
          "https://ts2.tc.mm.bing.net/th/id/OIP-C.9bVtoHTBQRCsKukxxEl-bgAAAA?r=0&rs=1&pid=ImgDetMain&o=7&rm=3";
        images.dish = new Image();
        images.dish.onload = onLoad;
        images.dish.onerror = onLoad;
        images.dish.src =
          "https://ts2.tc.mm.bing.net/th/id/OIP-C.9bVtoHTBQRCsKukxxEl-bgAAAA?r=0&rs=1&pid=ImgDetMain&o=7&rm=3";
        images.leftTable = new Image();
        images.leftTable.onload = onLoad;
        images.leftTable.onerror = onLoad;
        images.leftTable.src =
          "https://ts2.tc.mm.bing.net/th/id/OIP-C.9bVtoHTBQRCsKukxxEl-bgAAAA?r=0&rs=1&pid=ImgDetMain&o=7&rm=3";
        images.rightTable = new Image();
        images.rightTable.onload = onLoad;
        images.rightTable.onerror = onLoad;
        images.rightTable.src =
          "https://ts2.tc.mm.bing.net/th/id/OIP-C.9bVtoHTBQRCsKukxxEl-bgAAAA?r=0&rs=1&pid=ImgDetMain&o=7&rm=3";
      }

      function drawGame() {
        const W = canvas.width,
          H = canvas.height;
        const cellW = W / COLS,
          cellH = H / ROWS;

        ctx.clearRect(0, 0, W, H);
        ctx.fillStyle = "#fdf8f0";
        ctx.fillRect(0, 0, W, H);

        // 网格
        ctx.strokeStyle = "rgba(200, 190, 175, 0.2)";
        ctx.lineWidth = 1;
        for (let r = 0; r <= ROWS; r++) {
          ctx.beginPath();
          ctx.moveTo(0, r * cellH);
          ctx.lineTo(W, r * cellH);
          ctx.stroke();
        }
        for (let c = 0; c <= COLS; c++) {
          ctx.beginPath();
          ctx.moveTo(c * cellW, 0);
          ctx.lineTo(c * cellW, H);
          ctx.stroke();
        }

        const beltTop = cellH * 1.5,
          beltBottom = cellH * 6.8,
          beltHeight = beltBottom - beltTop;
        ctx.fillStyle = "rgba(200, 190, 175, 0.3)";
        ctx.fillRect(0, beltTop, W, beltHeight);
        if (
          images.belt &&
          images.belt.complete &&
          images.belt.naturalWidth > 0
        ) {
          const imgH = beltHeight;
          const offset = ((state.beltOffset % imgH) + imgH) % imgH;
          ctx.drawImage(images.belt, 0, beltTop + offset, W, imgH);
          ctx.drawImage(images.belt, 0, beltTop + offset - imgH, W, imgH);
        }
        const stripeOffset = ((state.beltOffset % 30) + 30) % 30;
        for (
          let y = beltTop - 30 + stripeOffset;
          y < beltBottom + 30;
          y += 30
        ) {
          ctx.fillStyle = "rgba(160,150,135,0.15)";
          ctx.fillRect(0, y, W, 4);
          ctx.fillStyle = "rgba(180,170,155,0.10)";
          ctx.fillRect(0, y + 15, W, 4);
        }

        // 食材
        state.ingredients.forEach((ing) => {
          if (!ing.alive) return;
          const size = ing.size,
            x = ing.x,
            y = ing.y;
          const glow = ctx.createRadialGradient(x, y, 0, x, y, size * 1.6);
          glow.addColorStop(0, ing.color + "60");
          glow.addColorStop(1, ing.color + "00");
          ctx.fillStyle = glow;
          ctx.beginPath();
          ctx.arc(x, y, size * 1.6, 0, Math.PI * 2);
          ctx.fill();
          ctx.shadowColor = "rgba(0,0,0,0.1)";
          ctx.shadowBlur = 8;
          ctx.beginPath();
          ctx.arc(x, y, size, 0, Math.PI * 2);
          ctx.fillStyle = ing.color;
          ctx.fill();
          ctx.shadowBlur = 0;
          ctx.strokeStyle = "rgba(255,255,255,0.5)";
          ctx.lineWidth = 2;
          ctx.stroke();
          ctx.font = `${size * 1.0}px serif`;
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillStyle = "#fff";
          ctx.shadowBlur = 6;
          ctx.shadowColor = "rgba(0,0,0,0.2)";
          ctx.fillText(ing.emoji, x, y + 1);
          ctx.shadowBlur = 0;
        });

        // 厨师
        const chefX = state.chefX * W,
          chefY = cellH * 5.2,
          chefSize = cellH * 1.6;
        const tiltAngle = (state.chefX - 0.5) * 0.6;
        ctx.save();
        ctx.translate(chefX, chefY + chefSize * 0.4);
        ctx.rotate(tiltAngle);
        ctx.shadowColor = "rgba(0,0,0,0.1)";
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.ellipse(
          0,
          -chefSize * 0.3,
          chefSize * 0.5,
          chefSize * 0.6,
          0,
          0,
          Math.PI * 2,
        );
        ctx.fillStyle = "#3498db";
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(
          0,
          -chefSize * 0.15,
          chefSize * 0.4,
          chefSize * 0.5,
          0,
          0,
          Math.PI * 2,
        );
        ctx.fillStyle = "#ffffff";
        ctx.fill();
        ctx.shadowBlur = 6;
        ctx.beginPath();
        ctx.arc(0, -chefSize * 0.55, chefSize * 0.3, 0, Math.PI * 2);
        ctx.fillStyle = "#f5d6a8";
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(
          0,
          -chefSize * 0.85,
          chefSize * 0.35,
          chefSize * 0.25,
          0,
          0,
          Math.PI * 2,
        );
        ctx.fillStyle = "#ffffff";
        ctx.fill();
        ctx.fillStyle = "#e74c3c";
        ctx.beginPath();
        ctx.ellipse(
          0,
          -chefSize * 0.9,
          chefSize * 0.25,
          chefSize * 0.12,
          0,
          0,
          Math.PI * 2,
        );
        ctx.fill();
        const eyeOffset = (state.chefX - 0.5) * 10;
        ctx.fillStyle = "#2c3e50";
        ctx.beginPath();
        ctx.arc(-10 + eyeOffset, -chefSize * 0.6, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(10 + eyeOffset, -chefSize * 0.6, 4, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#fff";
        ctx.beginPath();
        ctx.arc(-8 + eyeOffset, -chefSize * 0.64, 1.8, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(12 + eyeOffset, -chefSize * 0.64, 1.8, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#c0392b";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(0, -chefSize * 0.45, 10, 0.1, Math.PI - 0.1);
        ctx.stroke();
        ctx.shadowBlur = 0;
        ctx.restore();

        if (state.menuComplete && state.isPlaying) {
          ctx.save();
          ctx.font = "48px serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.shadowColor = "rgba(0,0,0,0.2)";
          ctx.shadowBlur = 20;
          ctx.fillText("🍳", chefX, chefY - chefSize * 1.2);
          ctx.shadowBlur = 0;
          ctx.restore();
        }

        // 菜单等其他绘制省略（和原版一致）
      }

      // roundRect polyfill
      if (!CanvasRenderingContext2D.prototype.roundRect) {
        CanvasRenderingContext2D.prototype.roundRect = function (
          x,
          y,
          w,
          h,
          radii,
        ) {
          const r = typeof radii === "number" ? radii : radii || 0;
          this.moveTo(x + r, y);
          this.arcTo(x + w, y, x + w, y + h, r);
          this.arcTo(x + w, y + h, x, y + h, r);
          this.arcTo(x, y + h, x, y, r);
          this.arcTo(x, y, x + w, y, r);
          return this;
        };
      }

      let lastTimestamp = 0;
      function gameLoop(timestamp) {
        const delta = lastTimestamp
          ? Math.min((timestamp - lastTimestamp) / 1000, 0.05)
          : 0.016;
        lastTimestamp = timestamp;
        updateGame(delta);
        drawGame();
        requestAnimationFrame(gameLoop);
      }

      function endGame() {
        if (state.isGameOver) return;
        state.isGameOver = true;
        state.isPlaying = false;
        stopBGM();
        finalScoreEl.textContent = state.score;
        statDishesEl.textContent = state.dishesServed;
        statIngredientsEl.textContent = state.ingredientsCollected;
        statComboEl.textContent = state.maxCombo;
        resultModal.classList.remove("hidden");
      }

      function resetGame() {
        if (video.srcObject) {
          video.srcObject.getTracks().forEach((track) => track.stop());
          video.srcObject = null;
        }
        if (calibrateVideo.srcObject) {
          calibrateVideo.srcObject.getTracks().forEach((t) => t.stop());
          calibrateVideo.srcObject = null;
        }
        state.isPlaying = false;
        state.isPaused = false;
        state.isGameOver = false;
        state.timeLeft = GAME_DURATION;
        state.gold = INITIAL_GOLD;
        state.score = 0;
        state.dishesServed = 0;
        state.ingredientsCollected = 0;
        state.combo = 0;
        state.maxCombo = 0;
        state.chefX = 0.5;
        state.targetX = 0.5;
        state.headY = 0.5;
        state.isHeadUp = false;
        state.ingredients = [];
        state.pot = {};
        state.menu = [];
        state.menuComplete = false;
        state.dishName = "";
        state.leftDemand = null;
        state.rightDemand = null;
        state.queueTimer = 0;
        state.beltOffset = 0;
        state.isCalibrated = false;
        state.headTilt = 0;
        state.faceDetected = false;
        if (state.timerInterval) {
          clearInterval(state.timerInterval);
          state.timerInterval = null;
        }
        resultModal.classList.add("hidden");
        pauseModal.classList.add("hidden");
        startOverlay.classList.add("hidden");
        generateMenu();
      }

      function startGame() {
        resetGame();
        state.isPlaying = true;
        startOverlay.classList.add("hidden");
        pauseModal.classList.add("hidden");
        resultModal.classList.add("hidden");
        generateMenu();
        startBGM();
      }

      function togglePause() {
        if (!state.isPlaying || state.isGameOver) return;
        state.isPaused = !state.isPaused;
        if (state.isPaused) {
          pauseModal.classList.remove("hidden");
          stopBGM();
        } else {
          pauseModal.classList.add("hidden");
          startBGM();
        }
      }

      // ---------- 头控核心 ----------
      function initFaceMesh() {
        const faceMesh = new FaceMesh({
          locateFile: (file) =>
            `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/${file}`,
        });
        faceMesh.setOptions({
          maxNumFaces: 1,
          refineLandmarks: true,
          minDetectionConfidence: 0.4,
          minTrackingConfidence: 0.4,
        });
        faceMesh.onResults((results) => {
          if (
            results.multiFaceLandmarks &&
            results.multiFaceLandmarks.length > 0
          ) {
            const landmarks = results.multiFaceLandmarks[0];
            const noseTip = landmarks[1];
            const noseRoot = landmarks[168] || landmarks[0];
            if (noseTip && noseRoot) {
              // 镜像坐标（摄像头本身已镜像，这里再镜像一次恢复直觉方向）
              const nx = 1 - noseTip.x;
              const nrx = 1 - (noseRoot ? noseRoot.x : noseTip.x);
              const dx = nx - nrx;
              let tilt = clamp(dx * 15, -1, 1);
              state.headTilt = tilt;
              state.faceDetected = true;
              // 头控映射：0.5 为中心，倾斜±0.45
              state.targetX = clamp(0.5 + tilt * 0.45, 0.05, 0.95);
              state.headY = clamp(noseTip.y, 0, 1);

              // 调试显示
              debugStatus.innerHTML = "🟢 已检测";
              debugTilt.innerHTML = `倾斜: ${tilt.toFixed(2)}`;
            } else {
              state.faceDetected = false;
              debugStatus.innerHTML = "⚪ 未检测到";
            }
          } else {
            state.faceDetected = false;
            debugStatus.innerHTML = "⚪ 未检测到";
          }
        });
        return faceMesh;
      }

      // 手动帧循环发送到 FaceMesh
      function startFaceTracking() {
        if (!state.faceMesh) return;
        const sendFrame = async () => {
          if (video.readyState >= 2) {
            try {
              await state.faceMesh.send({ image: video });
            } catch (e) {
              console.warn("FaceMesh send error:", e);
            }
          }
          if (state.isPlaying || !calibrateModal.classList.contains("hidden")) {
            requestAnimationFrame(sendFrame);
          }
        };
        requestAnimationFrame(sendFrame);
      }

      async function startCamera() {
        if (video.srcObject) {
          video.srcObject.getTracks().forEach((t) => t.stop());
          video.srcObject = null;
        }
        if (calibrateVideo.srcObject) {
          calibrateVideo.srcObject.getTracks().forEach((t) => t.stop());
          calibrateVideo.srcObject = null;
        }
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: "user", width: 320, height: 240 },
          });
          video.srcObject = stream;
          calibrateVideo.srcObject = stream;
          await video.play();
          await calibrateVideo.play();

          state.faceMesh = initFaceMesh();
          startFaceTracking();
          cameraModal.classList.add("hidden");
          calibrateModal.classList.remove("hidden");
          initAudio();
          return true;
        } catch (err) {
          alert("摄像头错误: " + err.message);
          return false;
        }
      }

      // ---------- 事件绑定（只保留暂停点击）----------
      canvas.addEventListener("click", (e) => {
        const rect = canvas.getBoundingClientRect();
        const x = (e.clientX - rect.left) / rect.width;
        const y = (e.clientY - rect.top) / rect.height;
        if (x > 0.7 && y < 0.12 && state.isPlaying && !state.isGameOver) {
          togglePause();
        }
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "ArrowLeft") {
          state.targetX = clamp(state.targetX - 0.08, 0.05, 0.95);
        } else if (e.key === "ArrowRight") {
          state.targetX = clamp(state.targetX + 0.08, 0.05, 0.95);
        } else if (
          e.key === "ArrowUp" &&
          state.isPlaying &&
          !state.isPaused &&
          !state.isGameOver
        ) {
          serveDish();
        } else if (e.key === " ") {
          e.preventDefault();
          if (state.isPlaying) togglePause();
        }
      });

      cameraAllowBtn.addEventListener("click", startCamera);
      calibrateBtn.addEventListener("click", () => {
        state.isCalibrated = true;
        calibrateModal.classList.add("hidden");
        if (calibrateVideo.srcObject) {
          calibrateVideo.srcObject.getTracks().forEach((t) => t.stop());
          calibrateVideo.srcObject = null;
        }
        startGame();
      });
      startGameBtn.addEventListener("click", () => {
        if (!state.faceDetected) {
          alert("请先允许摄像头并等待人脸识别");
          return;
        }
        startGame();
      });
      resumeBtn.addEventListener("click", () => {
        if (state.isPaused) togglePause();
      });
      surrenderBtn.addEventListener("click", () => {
        if (state.isPlaying) {
          state.isPlaying = false;
          state.isGameOver = true;
          pauseModal.classList.add("hidden");
          endGame();
        }
      });
      retryBtn.addEventListener("click", () => {
        resetGame();
        startCamera();
      });

      document.querySelectorAll(".toggle-btn").forEach((btn) => {
        btn.addEventListener("click", function () {
          const setting = this.dataset.setting,
            val = this.dataset.val;
          const parent = this.closest(".toggle-wrap");
          parent
            .querySelectorAll(".toggle-btn")
            .forEach((b) => b.classList.remove("active"));
          this.classList.add("active");
          if (setting === "bgm") {
            bgmEnabled = val === "on";
            if (bgmEnabled && state.isPlaying && !state.isPaused) startBGM();
            else stopBGM();
          } else if (setting === "sfx") {
            sfxEnabled = val === "on";
          }
        });
      });

      function init() {
        loadImages(() => {
          resetGame();
          cameraModal.classList.remove("hidden");
          calibrateModal.classList.add("hidden");
          startOverlay.classList.add("hidden");
          pauseModal.classList.add("hidden");
          resultModal.classList.add("hidden");
          requestAnimationFrame(gameLoop);
        });
      }
      init();
      document.addEventListener(
        "click",
        () => {
          initAudio();
        },
        { once: true },
      );
    </script>
  </body>
</html>
